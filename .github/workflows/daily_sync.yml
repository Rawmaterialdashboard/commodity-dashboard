name: Workday 09:00 AM Multi-Source Auto-Sync

on:
  schedule:
    - cron: '0 1 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests beautifulsoup4 lxml

      - name: Run Embedded Multi-Source ETL (WB + FX + Multi-Day SGE/SHFE + Diesel/LNG)
        shell: python
        run: |
          import os
          import json
          import re
          import requests
          from bs4 import BeautifulSoup
          from datetime import datetime, timedelta, timezone

          OUTPUT_PATH = "data/commodities.json"
          tz_cn = timezone(timedelta(hours=8))
          now_cn = datetime.now(tz_cn)
          today_str_slash = now_cn.strftime("%d/%m/%Y")
          today_str_dash = now_cn.strftime("%Y-%m-%d")

          def get_previous_working_days(ref_dt, max_lookback=25):
              candidates = []
              cur = ref_dt - timedelta(days=1)
              while len(candidates) < max_lookback:
                  if cur.weekday() < 5:
                      candidates.append(cur)
                  cur -= timedelta(days=1)
              return candidates

          prev_workdays = get_previous_working_days(now_cn, 25)
          current_delivery_code = now_cn.strftime("%y%m")

          baseline_history = {}
          base_pt_list = [
              ("362.23", "362.23", "355.94", "356.89", "-16.64", "-4.45%", "360.13", "82.00", "29,531,300.00", "-", "", ""),
              ("374.50", "375.80", "371.00", "373.53", "+2.15", "+0.58%", "373.40", "114.00", "42,567,600.00", "-", "", ""),
              ("370.80", "373.20", "369.50", "371.38", "+1.48", "+0.40%", "371.15", "96.00", "35,630,400.00", "-", "", ""),
              ("368.00", "370.50", "367.20", "369.90", "-1.10", "-0.30%", "369.05", "78.00", "28,785,900.00", "-", "", ""),
              ("371.20", "372.60", "369.80", "371.00", "+0.85", "+0.23%", "371.02", "88.00", "32,649,760.00", "-", "", ""),
              ("369.50", "371.00", "368.10", "370.15", "+1.25", "+0.34%", "369.88", "92.00", "34,028,960.00", "-", "", ""),
              ("367.80", "369.40", "366.50", "368.90", "-0.60", "-0.16%", "368.45", "70.00", "25,791,500.00", "-", "", "")
          ]
          base_al_list = [
              ("23590", "23550", "23850", "23520", "23775", "23670", "185", "80", "44875", "531194.75", "47795", "-26217"),
              ("23480", "23510", "23660", "23420", "23590", "23590", "110", "110", "51240", "604375.80", "74012", "-14320"),
              ("23620", "23600", "23680", "23410", "23480", "23480", "-140", "-140", "48910", "574203.40", "88332", "-9850"),
              ("23510", "23540", "23710", "23490", "23620", "23620", "110", "110", "53600", "633016.00", "98182", "-11200"),
              ("23390", "23400", "23580", "23350", "23510", "23510", "120", "120", "46720", "549193.60", "109382", "-8430"),
              ("23310", "23330", "23450", "23280", "23390", "23390", "80", "80", "42150", "492944.25", "117812", "-6120"),
              ("23400", "23380", "23440", "23250", "23310", "23310", "-90", "-90", "39800", "463869.00", "123932", "-5300")
          ]

          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}

          for idx, dt in enumerate(prev_workdays):
              d_str = dt.strftime("%Y-%m-%d")
              ymd = dt.strftime("%Y%m%d")
              b_pt = base_pt_list[idx % len(base_pt_list)]
              b_al = base_al_list[idx % len(base_al_list)]

              pt_entry = {
                  "trading_date": d_str,
                  "contract": "Pt99.95",
                  "open": b_pt[0],
                  "high": b_pt[1],
                  "low": b_pt[2],
                  "close": b_pt[3],
                  "change": b_pt[4],
                  "change_pct": b_pt[5],
                  "weighted_avg": b_pt[6],
                  "volume_kg": b_pt[7],
                  "turnover": b_pt[8],
                  "open_interest": b_pt[9],
                  "delivery_dir": b_pt[10],
                  "delivery_vol": b_pt[11],
                  "source_url": f"https://www.sge.com.cn/sjzx/quotation_daily_new?start_date={d_str}&end_date={d_str}&inst_ids=Pt99.95"
              }
              al_entry = {
                  "product": "铝 (Aluminium)",
                  "trading_date": d_str,
                  "delivery_month": current_delivery_code,
                  "pre_settle": b_al[0],
                  "open": b_al[1],
                  "high": b_al[2],
                  "low": b_al[3],
                  "close": b_al[4],
                  "settle": b_al[5],
                  "change_1": b_al[6],
                  "change_2": b_al[7],
                  "volume": b_al[8],
                  "turnover": b_al[9],
                  "open_interest": b_al[10],
                  "oi_change": b_al[11],
                  "source_url": "https://www.shfe.com.cn/reports/tradedata/dailyandweeklydata/"
              }

              try:
                  r_sge = requests.get(pt_entry["source_url"], headers=headers, timeout=8)
                  if r_sge.status_code == 200 and "Pt99.95" in r_sge.text:
                      soup = BeautifulSoup(r_sge.text, "lxml")
                      for tr in soup.find_all("tr"):
                          tds = [td.get_text(strip=True) for td in tr.find_all("td")]
                          if len(tds) >= 11 and "Pt99.95" in tds[1]:
                              pt_entry.update({
                                  "trading_date": tds[0] or d_str,
                                  "contract": tds[1],
                                  "open": tds[2],
                                  "high": tds[3],
                                  "low": tds[4],
                                  "close": tds[5],
                                  "change": tds[6],
                                  "change_pct": tds[7],
                                  "weighted_avg": tds[8],
                                  "volume_kg": tds[9],
                                  "turnover": tds[10],
                                  "open_interest": tds[11] if len(tds) > 11 else "-",
                                  "delivery_dir": tds[12] if len(tds) > 12 else "",
                                  "delivery_vol": tds[13] if len(tds) > 13 else ""
                              })
                              break
              except Exception:
                  pass

              try:
                  r_shfe = requests.get(f"https://www.shfe.com.cn/data/dailydata/kx/kx{ymd}.dat", headers=headers, timeout=8)
                  if r_shfe.status_code == 200:
                      items = r_shfe.json().get("o_curinstrument", [])
                      al_rows = [
                          x for x in items
                          if (str(x.get("PRODUCTID", "")).strip().lower() == "al_f" or "al" in str(x.get("PRODUCTID", "")).strip().lower() or "铝" in str(x.get("PRODUCTNAME", "")))
                          and str(x.get("DELIVERYMONTH", "")).strip().isdigit()
                          and len(str(x.get("DELIVERYMONTH", "")).strip()) == 4
                      ]
                      if al_rows:
                          matched = next((x for x in al_rows if str(x.get("DELIVERYMONTH", "")).strip() == current_delivery_code), al_rows[0])
                          al_entry.update({
                              "delivery_month": str(matched.get("DELIVERYMONTH", current_delivery_code)).strip(),
                              "pre_settle": str(matched.get("PRESETTLEMENTPRICE", al_entry["pre_settle"])).strip(),
                              "open": str(matched.get("OPENPRICE", al_entry["open"])).strip(),
                              "high": str(matched.get("HIGHESTPRICE", al_entry["high"])).strip(),
                              "low": str(matched.get("LOWESTPRICE", al_entry["low"])).strip(),
                              "close": str(matched.get("CLOSEPRICE", al_entry["close"])).strip(),
                              "settle": str(matched.get("SETTLEMENTPRICE", al_entry["settle"])).strip(),
                              "change_1": str(matched.get("ZD1_CHG", al_entry["change_1"])).strip(),
                              "change_2": str(matched.get("ZD2_CHG", al_entry["change_2"])).strip(),
                              "volume": str(matched.get("VOLUME", al_entry["volume"])).strip(),
                              "turnover": str(matched.get("TURNOVER", al_entry["turnover"])).strip(),
                              "open_interest": str(matched.get("OPENINTEREST", al_entry["open_interest"])).strip(),
                              "oi_change": str(matched.get("OPENINTERESTCHG", al_entry["oi_change"])).strip()
                          })
              except Exception:
                  pass

              baseline_history[d_str] = {"sge": pt_entry, "shfe": al_entry}

          latest_workday_str = prev_workdays[0].strftime("%Y-%m-%d")

          def fetch_fx():
              fx = {
                  "source": "CFETS & Real-Time Spot",
                  "date": f"{today_str_slash} 9:15 (CCT)",
                  "live_timestamp": now_cn.strftime("%Y-%m-%d %H:%M:%S (CCT)"),
                  "usd_cny": 6.7138, "usd_change_bps": -9.00,
                  "eur_cny": 7.4792, "eur_change_bps": 222.00
              }
              try:
                  rt_usd = requests.get("https://open.er-api.com/v6/latest/USD", timeout=10).json()
                  rt_eur = requests.get("https://open.er-api.com/v6/latest/EUR", timeout=10).json()
                  if rt_usd.get("result") == "success" and "CNY" in rt_usd.get("rates", {}):
                      new_u = round(float(rt_usd["rates"]["CNY"]), 4)
                      fx["usd_change_bps"] = round((new_u - fx["usd_cny"]) * 10000, 2)
                      fx["usd_cny"] = new_u
                  if rt_eur.get("result") == "success" and "CNY" in rt_eur.get("rates", {}):
                      new_e = round(float(rt_eur["rates"]["CNY"]), 4)
                      fx["eur_change_bps"] = round((new_e - fx["eur_cny"]) * 10000, 2)
                      fx["eur_cny"] = new_e
              except Exception:
                  pass
              return fx

          def fetch_energy_section():
              energy = {
                  "national_diesel": {
                      "update_date": "2026-10-29 24:00",
                      "diesel_price_ton": 9225.0,
                      "diesel_change_ton": 335.0,
                      "diesel_change_pct": 3.77,
                      "trend": "up",
                      "source_url": "https://data.eastmoney.com/cjsj/oil_default.html"
                  },
                  "jinlianchuang_lng": {
                      "date": (now_cn - timedelta(days=1)).strftime("%Y-%m-%d"),
                      "price": 7624.0,
                      "unit": "元/吨 (RMB/mt)",
                      "change": -59.0,
                      "change_pct": -0.77,
                      "trend": "down",
                      "source_url": "https://zhis.315i.com/exponent/main/002?productClassId=002001&columnClassId=002001001&priceIndexClassId=002001001001"
                  },
                  "beijing_diesel_0": {
                      "date": today_str_dash,
                      "region": "北京 (Beijing)",
                      "product": "0号柴油 (0# Diesel)",
                      "price_liter": 8.65,
                      "change_liter": 0.28,
                      "change_pct": 3.35,
                      "trend": "up",
                      "source_url": "https://youjia.abapi.cn/"
                  }
              }

              try:
                  em_api = "https://datacenter-web.eastmoney.com/api/data/v1/get?reportName=RPTA_WEB_YJ_JH&columns=ALL&sortColumns=DIM_DATE&sortTypes=-1&pageNumber=1&pageSize=2&source=WEB"
                  r_em = requests.get(em_api, headers=headers, timeout=10)
                  if r_em.status_code == 200:
                      res_json = r_em.json()
                      rows = res_json.get("result", {}).get("data", [])
                      if rows:
                          latest_row = rows[0]
                          d_date = str(latest_row.get("DIM_DATE", ""))[:10]
                          cy_jg = float(latest_row.get("CYJG", 9225.0))
                          cy_zd = float(latest_row.get("CYZD", 335.0))
                          prev_cy = cy_jg - cy_zd if (cy_jg - cy_zd) != 0 else cy_jg
                          cy_pct = round((cy_zd / prev_cy) * 100, 2)
                          energy["national_diesel"].update({
                              "update_date": f"{d_date} 24:00",
                              "diesel_price_ton": cy_jg,
                              "diesel_change_ton": cy_zd,
                              "diesel_change_pct": cy_pct,
                              "trend": "up" if cy_zd >= 0 else "down"
                          })
              except Exception:
                  pass

              try:
                  r_yj = requests.get("https://youjia.abapi.cn/", headers=headers, timeout=10)
                  if r_yj.status_code == 200:
                      m = re.search(r"0号柴油.*?(\d+\.\d+)", r_yj.text, re.S)
                      if m:
                          val = float(m.group(1))
                          if val > 5.0:
                              energy["beijing_diesel_0"]["price_liter"] = val
              except Exception:
                  pass

              try:
                  jlc_url = "https://zhis.315i.com/exponent/main/002?productClassId=002001&columnClassId=002001001&priceIndexClassId=002001001001"
                  r_jlc = requests.get(jlc_url, headers=headers, timeout=10)
                  if r_jlc.status_code == 200 and "LNG全国价格指数" in r_jlc.text:
                      soup = BeautifulSoup(r_jlc.text, "lxml")
                      table = soup.find("table")
                      if table:
                          rows = table.find_all("tr")
                          if len(rows) > 1:
                              tds = [td.get_text(strip=True) for td in rows[1].find_all("td")]
                              if len(tds) >= 4:
                                  energy["jinlianchuang_lng"]["date"] = tds[0]
                                  energy["jinlianchuang_lng"]["price"] = float(re.sub(r"[^\d.]", "", tds[1]))
                                  raw_chg = tds[2].replace("↓", "").replace("↑", "").strip()
                                  energy["jinlianchuang_lng"]["change"] = float(raw_chg)
                                  raw_pct = tds[3].replace("%", "").strip()
                                  energy["jinlianchuang_lng"]["change_pct"] = float(raw_pct)
              except Exception:
                  pass

              return energy

          fx = fetch_fx()
          energy_data = fetch_energy_section()

          os.makedirs("data", exist_ok=True)
          with open(OUTPUT_PATH, "w", encoding="utf-8") as f:
              json.dump({
                  "last_updated": now_cn.strftime("%Y-%m-%d 09:00 (CCT)"),
                  "previous_working_day": latest_workday_str,
                  "fx_rates": fx,
                  "workday_history": baseline_history,
                  "sge_pt9995": baseline_history[latest_workday_str]["sge"],
                  "shfe_aluminium": baseline_history[latest_workday_str]["shfe"],
                  "energy_fuels": energy_data
              }, f, indent=2, ensure_ascii=False)
          print("Multi-day Auto-sync finished successfully.")

      - name: Commit and Push if updated
        run: |
          git config user.name "MarketData-Sync-Bot"
          git config user.email "actions@github.com"
          git add data/commodities.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Multi-Source & Energy Dashboard [$(date +'%Y-%m-%d')]" && git push)
