name: Daily World Bank, FX, SGE & SHFE Auto-Sync

on:
  schedule:
    - cron: '20 1 * * 1-5'
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests beautifulsoup4 lxml

      - name: Run Embedded Multi-Source ETL (World Bank + Live FX + SGE Pt99.95 + SHFE Al)
        shell: python
        run: |
          import os
          import io
          import json
          import requests
          import pandas as pd
          from bs4 import BeautifulSoup
          from datetime import datetime, timedelta, timezone

          WB_EXCEL_URL = "https://thedocs.worldbank.org/en/doc/5d903e848db1d1b83e0ec8f744e55570-0350012021/related/CMO-Historical-Data-Monthly.xlsx"
          OUTPUT_PATH = "data/commodities.json"

          tz_cn = timezone(timedelta(hours=8))
          now_cn = datetime.now(tz_cn)
          today_str_slash = now_cn.strftime("%d/%m/%Y")
          today_str_dash = now_cn.strftime("%Y-%m-%d")

          def get_previous_working_days(ref_dt, max_lookback=10):
              candidates = []
              cur = ref_dt - timedelta(days=1)
              while len(candidates) < max_lookback:
                  if cur.weekday() < 5:
                      candidates.append(cur)
                  cur -= timedelta(days=1)
              return candidates

          prev_workdays = get_previous_working_days(now_cn)
          current_delivery_code = now_cn.strftime("%y%m")

          # ---------------------------------------------------------
          # 1. Fetch SGE Daily Quotation for Pt99.95 (All 14 Columns)
          # ---------------------------------------------------------
          def fetch_sge_pt9995(candidates):
              default_url = "https://www.sge.com.cn/sjzx/quotation_daily_new?start_date=2026-10-30&end_date=2026-10-30&inst_ids=Pt99.95"
              sge_info = {
                  "trading_date": "2026-10-30",
                  "contract": "Pt99.95",
                  "open": "362.23",
                  "high": "362.23",
                  "low": "355.94",
                  "close": "356.89",
                  "change": "-16.64",
                  "change_pct": "-4.45%",
                  "weighted_avg": "360.13",
                  "volume_kg": "82.00",
                  "turnover": "29,531,300.00",
                  "open_interest": "-",
                  "delivery_dir": "",
                  "delivery_vol": "",
                  "source_url": default_url
              }
              headers = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                  "Referer": "https://www.sge.com.cn/sjzx/quotation_daily_new",
                  "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8"
              }
              for dt_obj in candidates:
                  d_str = dt_obj.strftime("%Y-%m-%d")
                  url = f"https://www.sge.com.cn/sjzx/quotation_daily_new?start_date={d_str}&end_date={d_str}&inst_ids=Pt99.95"
                  try:
                      resp = requests.get(url, headers=headers, timeout=12)
                      if resp.status_code == 200 and "Pt99.95" in resp.text:
                          soup = BeautifulSoup(resp.text, "lxml")
                          for tr in soup.find_all("tr"):
                              tds = [td.get_text(strip=True) for td in tr.find_all("td")]
                              if len(tds) >= 11 and "Pt99.95" in tds[1]:
                                  sge_info["trading_date"] = tds[0] or d_str
                                  sge_info["contract"] = tds[1]
                                  sge_info["open"] = tds[2]
                                  sge_info["high"] = tds[3]
                                  sge_info["low"] = tds[4]
                                  sge_info["close"] = tds[5]
                                  sge_info["change"] = tds[6]
                                  sge_info["change_pct"] = tds[7]
                                  sge_info["weighted_avg"] = tds[8]
                                  sge_info["volume_kg"] = tds[9]
                                  sge_info["turnover"] = tds[10]
                                  sge_info["open_interest"] = tds[11] if len(tds) > 11 else "-"
                                  sge_info["delivery_dir"] = tds[12] if len(tds) > 12 else ""
                                  sge_info["delivery_vol"] = tds[13] if len(tds) > 13 else ""
                                  sge_info["source_url"] = url
                                  return sge_info
                  except Exception as e:
                      print(f"SGE attempt for {d_str} skipped:", e)
              return sge_info

          # ---------------------------------------------------------
          # 2. Fetch SHFE Daily Express for Aluminium (All 13 Columns)
          # ---------------------------------------------------------
          def fetch_shfe_aluminium(candidates, target_deliv):
              shfe_page_url = "https://www.shfe.com.cn/reports/tradedata/dailyandweeklydata/"
              shfe_info = {
                  "product": "铝 (Aluminium)",
                  "trading_date": "2026-10-30",
                  "delivery_month": "2611",
                  "pre_settle": "23590",
                  "open": "23550",
                  "high": "23850",
                  "low": "23520",
                  "close": "23775",
                  "settle": "23670",
                  "change_1": "185",
                  "change_2": "80",
                  "volume": "44875",
                  "turnover": "531194.75",
                  "open_interest": "47795",
                  "oi_change": "-26217",
                  "source_url": shfe_page_url
              }
              headers = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                  "Referer": shfe_page_url
              }
              for dt_obj in candidates:
                  ymd = dt_obj.strftime("%Y%m%d")
                  d_str = dt_obj.strftime("%Y-%m-%d")
                  dat_url = f"https://www.shfe.com.cn/data/dailydata/kx/kx{ymd}.dat"
                  try:
                      resp = requests.get(dat_url, headers=headers, timeout=12)
                      if resp.status_code == 200:
                          data_json = resp.json()
                          cursors = data_json.get("o_curinstrument", [])
                          al_rows = [
                              r for r in cursors
                              if ("al" in str(r.get("PRODUCTID", "")).lower() or "铝" in str(r.get("PRODUCTNAME", "")))
                              and str(r.get("DELIVERYMONTH", "")).strip() not in ("小计", "总计", "")
                          ]
                          if al_rows:
                              matched = None
                              for r in al_rows:
                                  if str(r.get("DELIVERYMONTH", "")).strip() == target_deliv:
                                      matched = r
                                      break
                              if not matched:
                                  matched = al_rows[0]

                              shfe_info["trading_date"] = d_str
                              shfe_info["delivery_month"] = str(matched.get("DELIVERYMONTH", target_deliv)).strip()
                              shfe_info["pre_settle"] = str(matched.get("PRESETTLEMENTPRICE", shfe_info["pre_settle"])).strip()
                              shfe_info["open"] = str(matched.get("OPENPRICE", shfe_info["open"])).strip()
                              shfe_info["high"] = str(matched.get("HIGHESTPRICE", shfe_info["high"])).strip()
                              shfe_info["low"] = str(matched.get("LOWESTPRICE", shfe_info["low"])).strip()
                              shfe_info["close"] = str(matched.get("CLOSEPRICE", shfe_info["close"])).strip()
                              shfe_info["settle"] = str(matched.get("SETTLEMENTPRICE", shfe_info["settle"])).strip()
                              shfe_info["change_1"] = str(matched.get("ZD1_CHG", shfe_info["change_1"])).strip()
                              shfe_info["change_2"] = str(matched.get("ZD2_CHG", shfe_info["change_2"])).strip()
                              shfe_info["volume"] = str(matched.get("VOLUME", shfe_info["volume"])).strip()
                              shfe_info["turnover"] = str(matched.get("TURNOVER", shfe_info["turnover"])).strip()
                              shfe_info["open_interest"] = str(matched.get("OPENINTEREST", shfe_info["open_interest"])).strip()
                              shfe_info["oi_change"] = str(matched.get("OPENINTERESTCHG", shfe_info["oi_change"])).strip()
                              return shfe_info
                  except Exception as e:
                      print(f"SHFE attempt for {ymd} skipped:", e)
              return shfe_info

          # ---------------------------------------------------------
          # 3. Fetch Today's Official & Real-Time FX Rates (CFETS + Live Feed)
          # ---------------------------------------------------------
          def fetch_official_and_live_fx():
              fx_data = {
                  "source": "CFETS Official Fixing & Real-Time Spot",
                  "source_url": "http://www.chinamoney.com.cn/english/bmkcpr/",
                  "safe_url": "http://m.safe.gov.cn/safe/rmbhlzjj/index.html",
                  "date": f"{today_str_slash} 9:15 (CCT)",
                  "live_timestamp": now_cn.strftime("%Y-%m-%d %H:%M:%S (CCT)"),
                  "usd_cny": 6.7138,
                  "usd_change_bps": -9.00,
                  "eur_cny": 7.4792,
                  "eur_change_bps": 222.00
              }
              # Channel A: CFETS Official API
              try:
                  cfets_url = "https://www.chinamoney.com.cn/ags/ms/cm-u-bk-ccpr/CprRecSumDaily"
                  headers = {
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
                      "Referer": "https://www.chinamoney.com.cn/english/bmkcpr/"
                  }
                  res = requests.post(cfets_url, headers=headers, timeout=10)
                  if res.status_code == 200:
                      payload = res.json()
                      recs = payload.get("records", [])
                      for r in recs:
                          pair = str(r.get("vrtEName", "")).upper()
                          price = float(r.get("price", 0))
                          bp = float(r.get("bp", 0))
                          is_down = str(r.get("upOrDown", "")) == "1"
                          signed_bp = -abs(bp) if is_down else abs(bp)
                          if "USD/CNY" in pair and price > 0:
                              fx_data["usd_cny"] = round(price, 4)
                              fx_data["usd_change_bps"] = round(signed_bp, 2)
                          elif "EUR/CNY" in pair and price > 0:
                              fx_data["eur_cny"] = round(price, 4)
                              fx_data["eur_change_bps"] = round(signed_bp, 2)
                      if recs:
                          fx_data["date"] = f"{today_str_slash} 9:15 (CCT)"
                          return fx_data
              except Exception as e:
                  print("CFETS direct connection skipped:", e)

              # Channel B: Real-Time Market Feed if CFETS blocked overseas IP
              try:
                  rt_usd = requests.get("https://open.er-api.com/v6/latest/USD", timeout=10).json()
                  rt_eur = requests.get("https://open.er-api.com/v6/latest/EUR", timeout=10).json()
                  if rt_usd.get("result") == "success" and "CNY" in rt_usd.get("rates", {}):
                      new_usd = round(float(rt_usd["rates"]["CNY"]), 4)
                      fx_data["usd_change_bps"] = round((new_usd - fx_data["usd_cny"]) * 10000, 2)
                      fx_data["usd_cny"] = new_usd
                  if rt_eur.get("result") == "success" and "CNY" in rt_eur.get("rates", {}):
                      new_eur = round(float(rt_eur["rates"]["CNY"]), 4)
                      fx_data["eur_change_bps"] = round((new_eur - fx_data["eur_cny"]) * 10000, 2)
                      fx_data["eur_cny"] = new_eur
                  fx_data["date"] = f"{today_str_slash} Real-Time (CCT)"
              except Exception as e:
                  print("Backup FX feed notice:", e)

              return fx_data

          sge_pt_data = fetch_sge_pt9995(prev_workdays)
          shfe_al_data = fetch_shfe_aluminium(prev_workdays, current_delivery_code)
          fx_data = fetch_official_and_live_fx()

          # ---------------------------------------------------------
          # 4. Fetch World Bank Pink Sheet Monthly Data
          # ---------------------------------------------------------
          wb_updates = {}
          try:
              resp = requests.get(WB_EXCEL_URL, headers={"User-Agent": "Mozilla/5.0"}, timeout=60)
              resp.raise_for_status()
              excel_data = pd.ExcelFile(io.BytesIO(resp.content))
              sheet_name = "Monthly Prices" if "Monthly Prices" in excel_data.sheet_names else excel_data.sheet_names[0]
              raw_df = pd.read_excel(excel_data, sheet_name=sheet_name)

              header_row_idx = 4
              for idx, row in raw_df.iterrows():
                  first_val = str(row.iloc[0]).strip().upper()
                  if "1960M01" in first_val:
                      header_row_idx = max(0, idx - 1)
                      break

              columns = [str(c).strip() for c in raw_df.iloc[header_row_idx].tolist()]
              columns[0] = "Date"
              clean_df = raw_df.iloc[header_row_idx + 1:].copy()
              clean_df.columns = columns
              clean_df = clean_df.dropna(subset=["Date"])
              clean_df["Date"] = clean_df["Date"].astype(str).str.strip().str.replace("M", "-")
              clean_df = clean_df[clean_df["Date"].str.match(r"^\d{4}-\d{2}$", na=False)]
              clean_df = clean_df[(clean_df["Date"] >= "2016-01") & (clean_df["Date"] <= "2026-12")]

              col_map = {}
              for col in clean_df.columns:
                  cu = col.upper()
                  if "GOLD" in cu and "gold" not in col_map.values():
                      col_map[col] = "gold"
                  elif "ALUMINUM" in cu and "aluminium" not in col_map.values():
                      col_map[col] = "aluminium"
                  elif "COPPER" in cu and "copper" not in col_map.values():
                      col_map[col] = "copper"
                  elif "TIN" in cu and "tin" not in col_map.values():
                      col_map[col] = "tin"
                  elif ("RUBBER, TSR20" in cu or "RUBBER" in cu) and "rubber" not in col_map.values():
                      col_map[col] = "rubber"
                  elif "SILVER" in cu and "silver" not in col_map.values():
                      col_map[col] = "silver"

              for orig_col, target_key in col_map.items():
                  clean_df[target_key] = pd.to_numeric(clean_df[orig_col], errors="coerce")

              for _, r in clean_df.iterrows():
                  dt = r["Date"]
                  wb_updates[dt] = {}
                  for target_key in col_map.values():
                      val = r.get(target_key)
                      if pd.notna(val) and float(val) > 0:
                          wb_updates[dt][target_key] = round(float(val), 2)
          except Exception as e:
              print("World Bank fetch notice:", e)

          os.makedirs("data", exist_ok=True)
          with open(OUTPUT_PATH, "w", encoding="utf-8") as f:
              json.dump({
                  "last_updated": now_cn.strftime("%Y-%m-%d %H:%M (CCT)"),
                  "previous_working_day": sge_pt_data["trading_date"],
                  "fx_rates": fx_data,
                  "sge_pt9995": sge_pt_data,
                  "shfe_aluminium": shfe_al_data,
                  "wb_live_overrides": wb_updates
              }, f, indent=2, ensure_ascii=False)
          print("Successfully generated data/commodities.json")

      - name: Commit and Push if updated
        run: |
          git config user.name "MarketData-Sync-Bot"
          git config user.email "actions@github.com"
          git add data/commodities.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Pink Sheet, Live FX, SGE Pt99.95 and SHFE Al data" && git push)
